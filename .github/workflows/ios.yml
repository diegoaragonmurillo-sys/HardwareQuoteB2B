name: Verificación de código Swift

# El proyecto usa Xcode 27 (formato de proyecto 110 e iOS 27), versión que los
# runners alojados de GitHub todavía no incluyen (máximo Xcode 26.x), así que
# aquí no se puede compilar ni correr los tests.
# Lo que sí se verifica: que todos los archivos .swift tengan sintaxis válida.
# Los tests unitarios se corren localmente con:
#   xcodebuild test -project HardwareQuoteB2B.xcodeproj -scheme HardwareQuoteB2B \
#     -destination 'platform=iOS Simulator,name=<simulador iOS 27>' -only-testing:HardwareQuoteB2BTests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sintaxis:
    name: Sintaxis de todos los archivos Swift
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar sintaxis con swiftc
        run: |
          archivos=$(find HardwareQuoteB2B HardwareQuoteB2BTests HardwareQuoteB2BUITests -name '*.swift')
          echo "Archivos a verificar: $(echo "$archivos" | wc -l | tr -d ' ')"
          fallos=0
          for archivo in $archivos; do
            if ! swiftc -parse "$archivo"; then
              fallos=$((fallos + 1))
            fi
          done
          if [ "$fallos" -gt 0 ]; then
            echo "Archivos con errores de sintaxis: $fallos"
            exit 1
          fi
          echo "Sintaxis correcta en todos los archivos."
